<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>曼 · 效果预览</title><link rel="icon" href="../assets/glyph.svg"><link rel="stylesheet" href="preview.css"></head>
<body>
<main class="workspace">
  <header><div><h1>效果预览</h1><span>待你验收</span></div><a href="../">返回游戏</a></header>
  <section class="stage" aria-label="独立动效预览场景"><canvas id="stage" aria-label="按住划动也可切开陨石"></canvas><p id="phase" role="status">准备字形资源</p><p id="status" class="status">幼圆 · 中档</p></section>
  <section class="controls" aria-label="预览控制">
    <nav aria-label="选择演示"><button data-scene="full" aria-pressed="true">完整演示</button><button data-scene="cut">切开与分裂</button><button data-scene="impact">陨石撞地</button><button data-scene="collision">沿途碰撞</button><button data-scene="idle">建筑待机</button></nav>
    <div class="transport"><button id="play" disabled>暂停</button><button id="restart" disabled>重播</button><button id="cut" disabled>立即切开</button><label>速度<select id="speed"><option value="1">正常</option><option value="0.35">0.35 倍</option></select></label><label>字形<select id="font"><option value="youyuan">幼圆</option><option value="yahei">微软雅黑</option><option value="simsun">宋体</option></select></label><label>尺寸<select id="size"><option value="1">中档</option><option value="0.72">小档</option><option value="1.32">大档</option></select></label><button id="theme">深色</button></div>
    <div class="timeline"><output id="clock">0.0 / 26.4 s</output><input id="seek" type="range" min="0" max="26.4" step="0.01" value="0" aria-label="拖动演示进度"></div>
    <p class="note">可暂停、慢放、拖动进度；按住划动也能切开。效果已接入主游戏，此页保留为分段演示。</p>
  </section>
</main>
<script type="module" src="preview.js"></script>
</body></html>
